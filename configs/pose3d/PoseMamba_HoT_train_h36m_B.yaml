# General
train_2d: False
no_eval: False
finetune: False
partial_train: null

# Traning
epochs: 120
checkpoint_frequency: 30
batch_size: 4
dropout: 0.0
learning_rate: 0.0002
weight_decay: 0.01
lr_decay: 0.99

# Model
backbone: "PoseMamba_HoT"
maxlen: 243
dim_feat: 128
mlp_ratio: 2
depth: 10 #这里的深度*2就是网络深度
att_fuse: True

# HoT Parameters
token_num: 81  # 保留的token数量
layer_index: 5  # 开始剪枝的层数

# Data
data_root: data/motion3d/MB3D_f243s81/
subset_list: [H36M-SH]
dt_file: h36m_sh_conf_cam_source_final.pkl
clip_len: 243
data_stride: 81
rootrel: True
sample_stride: 1
num_joints: 17
no_conf: True
gt_2d: False

# Loss
lambda_3d_velocity: 20.0
lambda_scale: 0.5
lambda_lv: 0.0
lambda_lg: 0.0
lambda_a: 0.0
lambda_av: 0.0
lambda_3dw: 0.0
lambda_3d: 1.0
lambda_diff: 0.5
lambda_spatial_rank: 1.0
lambda_temporal_rank: 1.0

# Augmentation
synthetic: False
flip: True
mask_ratio: 0.
mask_T_ratio: 0.
noise: False